# Values layered on top of the existing rke2-multus release values by
# scripts/00-install-chart.sh. Everything not set here keeps the chart
# defaults, so the suite exercises the chart as shipped. Override the
# controller image etc. with CHART_VALUES or HELM_EXTRA_ARGS.
multiNetworkPolicy:
  enabled: true
# The test attachments use whereabouts IPAM, which the chart does not
# install by default.
rke2-whereabouts:
  enabled: true
# The suite runs with the thick plugin (multus daemon + multus-shim). It
# needs manifests.configMap, which the chart enables by default.
thickPlugin:
  enabled: true
