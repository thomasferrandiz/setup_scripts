---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: multus-demo
  name: multus-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multus-demo
  template:
    metadata:
      labels:
        app: multus-demo
      annotations:
        k8s.v1.cni.cncf.io/networks: macvlan1-config
    spec:
      containers:
      - name: network-multitool
        image: wbitt/network-multitool:extra
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          capabilities:
            add: ["NET_ADMIN","NET_RAW"]
