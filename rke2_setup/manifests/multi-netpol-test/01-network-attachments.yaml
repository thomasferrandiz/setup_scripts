---
# Two macvlan NetworkAttachmentDefinitions used as the policy target
# (test-net-a) and as an unrelated secondary network used to prove policy
# isolation (test-net-b). Both live in mnp-test-a; pods in mnp-test-b
# reference test-net-a using the "namespace/name" cross-namespace syntax.
#
# Adjust "master" to match the host interface used by your cluster nodes
# (see rke2_setup/manifests/multus_demo_nad.yaml for the reference example
# this is modeled on).
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: test-net-a
  namespace: mnp-test-a
spec:
  config: '{
            "cniVersion": "0.4.0",
            "name": "test-net-a",
            "plugins": [
                {
                    "type": "macvlan",
                    "capabilities": { "ips": true },
                    "master": "eth0",
                    "mode": "bridge",
                    "ipam": {
                      "type": "whereabouts",
                      "range": "192.168.101.0/24"
                    }
                }, {
                    "type": "tuning"
                } ]
        }'
---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: test-net-b
  namespace: mnp-test-a
spec:
  config: '{
            "cniVersion": "0.4.0",
            "name": "test-net-b",
            "plugins": [
                {
                    "type": "macvlan",
                    "capabilities": { "ips": true },
                    "master": "eth0",
                    "mode": "bridge",
                    "ipam": {
                      "type": "whereabouts",
                      "range": "192.168.102.0/24"
                    }
                }, {
                    "type": "tuning"
                } ]
        }'
