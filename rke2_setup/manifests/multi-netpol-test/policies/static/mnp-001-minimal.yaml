# MNP-001: minimal valid policy - empty podSelector selects all pods in the
# namespace, no rules. Used only to confirm the CRD accepts and persists a
# minimal object.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: mnp-001-minimal
  namespace: mnp-test-a
  annotations:
    k8s.v1.cni.cncf.io/policy-for: "mnp-test-a/test-net-a"
spec:
  podSelector: {}
