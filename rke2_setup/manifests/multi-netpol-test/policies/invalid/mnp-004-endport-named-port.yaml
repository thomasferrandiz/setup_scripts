# MNP-004: endPort combined with a named (string) port, which the CRD
# description explicitly disallows ("This field cannot be defined ... if
# the port field is defined as a named (string) port"). Not enforced by the
# structural schema; record actual behavior.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: invalid-endport-named-port
  namespace: mnp-test-a
  annotations:
    k8s.v1.cni.cncf.io/policy-for: "mnp-test-a/test-net-a"
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: http
          endPort: 8090
