# MNP-004: a NetworkPolicyPeer combining ipBlock with podSelector, which
# the CRD description disallows ("If this field is set then neither of the
# other fields can be [set]"). Not enforced by the structural schema;
# record actual behavior.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: invalid-ipblock-with-podselector
  namespace: mnp-test-a
  annotations:
    k8s.v1.cni.cncf.io/policy-for: "mnp-test-a/test-net-a"
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.101.0/24
          podSelector:
            matchLabels:
              app: client
