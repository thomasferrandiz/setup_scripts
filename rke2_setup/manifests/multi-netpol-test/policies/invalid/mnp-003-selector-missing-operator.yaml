# MNP-003: matchExpressions entry missing the required operator field.
# Expected: rejected by API admission ("operator: Required value").
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: invalid-selector-missing-operator
  namespace: mnp-test-a
  annotations:
    k8s.v1.cni.cncf.io/policy-for: "mnp-test-a/test-net-a"
spec:
  podSelector:
    matchExpressions:
      - key: app
  policyTypes:
    - Ingress
