# Apply with: kubectl --kubeconfig local.yaml apply -f opensuse-vm.yaml
apiVersion: v1
kind: Secret
metadata:
  name: opensuse-vm-01-cloudinit
  namespace: default
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: opensuse-vm-01
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMxUro1XAmxSZ6x7ij/fK5T0JWwxaLN+bahrjttNh94y tferrandiz@Thomass-MacBook-Pro-2.local
    users:
      - name: opensuse
        lock_passwd: true
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        groups: users
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMxUro1XAmxSZ6x7ij/fK5T0JWwxaLN+bahrjttNh94y tferrandiz@Thomass-MacBook-Pro-2.local
    write_files:
      # vm-net (10.113.64.0/22) is not routed to the Harvester management VLAN
      # (10.113.72.0/22, incl. the 10.113.72.100 VIP), so send it through eth1.
      # cloud-init 23.3 does not render non-default routes for openSUSE, hence the file.
      - path: /etc/sysconfig/network/ifroute-eth1
        permissions: "0644"
        content: |
          10.113.72.0/22 10.0.2.1 - eth1
    package_update: true
    packages:
      - qemu-guest-agent
    runcmd:
      - [systemctl, enable, --now, qemu-guest-agent.service]
      - [systemctl, restart, wicked]
  # eth1 uses KubeVirt masquerade, which always hands out 10.0.2.2/24 via 10.0.2.1.
  # It is static because wicked fails to add the eth1 route before a DHCP lease
  # exists; no gateway here keeps the default route on eth0.
  networkdata: |
    version: 1
    config:
      - type: physical
        name: eth0
        subnets:
          - type: dhcp4
      - type: physical
        name: eth1
        subnets:
          - type: static
            address: 10.0.2.2/24
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: opensuse-vm-01
  namespace: default
  annotations:
    # Harvester creates the root disk PVC from this template, cloned from the image.
    harvesterhci.io/volumeClaimTemplates: |
      [{"metadata":{"name":"opensuse-vm-01-disk-0","annotations":{"harvesterhci.io/imageId":"default/image-x49tz"}},"spec":{"accessModes":["ReadWriteMany"],"resources":{"requests":{"storage":"20Gi"}},"volumeMode":"Block","storageClassName":"longhorn-image-x49tz"}}]
  labels:
    harvesterhci.io/os: opensuse
spec:
  runStrategy: RerunOnFailure
  template:
    metadata:
      annotations:
        harvesterhci.io/sshNames: '["default/tferrandiz"]'
      labels:
        harvesterhci.io/vmName: opensuse-vm-01
    spec:
      nodeSelector:
        network.harvesterhci.io/cluster-net: "true"
      evictionStrategy: LiveMigrateIfPossible
      terminationGracePeriodSeconds: 120
      domain:
        machine:
          type: q35
        cpu:
          cores: 2
          sockets: 1
          threads: 1
        memory:
          guest: 4Gi
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 4Gi
        devices:
          disks:
            - name: disk-0
              bootOrder: 1
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          inputs:
            - name: tablet
              type: tablet
              bus: usb
          interfaces:
            - name: default
              model: virtio
              bridge: {}
            - name: management
              model: virtio
              masquerade: {}
      networks:
        - name: default
          multus:
            networkName: default/vm-net
        - name: management
          pod: {}
      volumes:
        - name: disk-0
          persistentVolumeClaim:
            claimName: opensuse-vm-01-disk-0
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: opensuse-vm-01-cloudinit
            networkDataSecretRef:
              name: opensuse-vm-01-cloudinit
