global_defs {
    enable_script_security
    script_user root
}

vrrp_script chk_haproxy {
    script "/usr/local/sbin/check-haproxy"
    interval 2
    timeout 2
    fall 2
    rise 2
    init_fail
}

vrrp_instance rke2_vip {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority ${priority}
    advert_int 1
    virtual_ipaddress {
        ${rke2_api_vip}/19 dev eth0
    }
    track_script {
        chk_haproxy
    }
}
