global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon
    maxconn 100000
    stats socket /var/lib/haproxy/stats user haproxy group haproxy mode 0640 level operator

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    option srvtcpka
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend rke2-supervisor
    bind *:9345
    default_backend rke2-supervisor

frontend kubernetes-api
    bind *:6443
    default_backend kubernetes-api

backend rke2-supervisor
    balance leastconn
    option tcp-check
    default-server inter 5s fall 3 rise 2
%{ for name, ip in servers ~}
    server ${name} ${ip}:9345 check
%{ endfor ~}

backend kubernetes-api
    balance leastconn
    option tcp-check
    default-server inter 5s fall 3 rise 2
%{ for name, ip in servers ~}
    server ${name} ${ip}:6443 check
%{ endfor ~}
