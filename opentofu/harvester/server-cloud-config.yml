#cloud-config
hostname: ${node_name}
package_update: true
packages:
  - qemu-guest-agent
  - docker
  - iptables
runcmd:
  - [systemctl, enable, --now, qemu-guest-agent.service]
  - [systemctl, enable, --now, docker.service]
  - [/usr/local/sbin/rke2-server-sles.sh]
write_files:
  - path: /usr/local/sbin/rke2-server-sles.sh
    owner: root:root
    permissions: '0755'
    content: |
      ${indent(6, rke2_server_script)}
  - path: /etc/rancher/rke2/config.yaml
    owner: root:root
    permissions: '0600'
    content: |
      write-kubeconfig-mode: "0644"
      token: ${rke2_token}
%{ if server_address != "" }
      server: https://${server_address}:9345
%{ endif }
      cni: cilium
      disable-kube-proxy: true
      cluster-cidr: ${rke2_cluster_cidr}
      service-cidr: 10.43.0.0/16
      node-name: ${node_name}
      tls-san:
        - ${rke2_api_vip}
      node-taint:
        - "CriticalAddonsOnly=true:NoExecute"
%{ if rke2_role == "control-plane" ~}
      # Control-plane only: the server address must run etcd. The API server
      # connects to the etcd-only servers directly (etcd-servers below), or
      # without any to the RKE2 etcd proxy on 127.0.0.1:2379.
      disable-etcd: true
%{ else ~}
      etcd-expose-metrics: true
%{ endif ~}
%{ if rke2_role == "etcd" ~}
      # etcd only: the kubelet reaches the API servers through the rke2-agent
      # load balancer.
      disable-apiserver: true
      disable-controller-manager: true
      disable-scheduler: true
%{ else ~}
      # The first two let the kube-burner runner read /metrics through the API
      # server's pod proxy. The rest lift the default client limits (qps 20,
      # burst 30, 5 workers), which throttled the controllers on 1000 nodes.
      kube-controller-manager-arg:
        - "bind-address=0.0.0.0"
        - "authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics"
        - "kube-api-qps=100"
        - "kube-api-burst=200"
        - "concurrent-deployment-syncs=20"
        - "concurrent-replicaset-syncs=20"
      # HAProxy balances TCP connections, so long-lived HTTP/2 clients of the
      # VIP stay on the API server they first reached. A small GOAWAY chance
      # makes them reconnect through HAProxy over time. It does not move
      # kubelets or Cilium: they use the rke2-agent local load balancer, which
      # stays on one server until a connection to it fails.
      kube-apiserver-arg:
        - "goaway-chance=0.001"
%{ if rke2_role == "control-plane" && length(etcd_servers) > 0 ~}
        # Replaces the RKE2 etcd proxy, which closes every connection to a
        # member when one 1-second supervisor health probe to it times out.
        - "etcd-servers=${join(",", etcd_servers)}"
%{ endif ~}
%{ endif ~}
users:
  - name: opensuse
    lock_passwd: true
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, docker
    ssh_authorized_keys:
      - ${harvester_public_key}
      - ${bench_public_key}
